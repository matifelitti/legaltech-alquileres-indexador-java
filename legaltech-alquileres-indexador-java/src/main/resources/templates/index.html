<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🏛️ Indexador LegalTech - PJN</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>
        <div class="container">
            <h1>Liquidación de Alquileres Comerciales</h1>
            <div class="subtitle">🏛️ MOTOR DE INDEXACIÓN POST-DNU 70/2023</div>

            <form action="/calcular" method="POST">
                <label>Locatario (Inquilino):</label>
                <input type="text" name="locatario" placeholder="Ej: Empresa S.A." required>

                <label>Locador (Propietario):</label>
                <input type="text" name="locador" placeholder="Ej: Propietario SRL" required>

                <label>Monto Base Inicial ($):</label>
                <input type="number" step="0.01" name="montoInicial" placeholder="Ej: 500000" required>

                <label>Mes de Inicio (Base):</label>
                <select name="mesInicio" required>
                    <option th:each="ind : ${listaIndices}" 
                            th:value="${ind.mes}" 
                            th:text="${ind.mes}"></option>
                </select>

                <label>Mes de Ajuste (Actualización):</label>
                <select name="mesAjuste" required>
                    <option th:each="ind : ${listaIndices}" 
                            th:value="${ind.mes}" 
                            th:text="${ind.mes}"></option>
                </select>


                <button type="submit">Calcular Canon Actualizado</button>
            </form>

            <div class="footer-caption">
                Aviso de Confidencialidad: Este sistema procesa los datos en memoria local cumpliendo con los estándares de la Ley N° 25.326 de Protección de Datos Personales de la República Argentina.
            </div>
        </div>
    </body>
</html>
